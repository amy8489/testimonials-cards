<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Testimonial cards for Amy Trout — real quotes, three different layouts.">
    <meta name="author" content="Amy Trout">
    <title>Testimonial Cards | Amy Trout</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <section class="testimonials">
        <article class="card card-bubble">
          <blockquote>
            <p>Amy has been a fantastic student to have in my classroom every day.</p>
          </blockquote>
          <footer class="person">
            <div class="avatar">MD</div>
            <div>
              <p class="name">Mr. Diak</p>
              <p class="role">Teacher</p>
            </div>
          </footer>
        </article>

        <article class="card card-standard">
          <blockquote>
            <p>Self-taught. Greasy hands. Here to help.</p>
          </blockquote>
          <footer class="person">
            <div class="avatar">AT</div>
            <div>
              <p class="name">Amy Trout</p>
              <p class="role">Founder, ChicMechanic</p>
            </div>
          </footer>
        </article>

        <article class="card card-carousel">
          <blockquote>
            <p>Roadmap.sh has made coding so much easier to learn.</p>
          </blockquote>
          <footer class="person">
            <div class="avatar">AT</div>
            <div>
              <p class="name">Amy Trout</p>
              <p class="role">Junior Frontend Developer</p>
            </div>
          </footer>
        </article>
      </section>
    </main>
  </body>
</html>
